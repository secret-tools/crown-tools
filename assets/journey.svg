<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Input, select a tool, inspect the result, save to Output"><defs><linearGradient id="g"><stop stop-color="#1a0b12"/><stop offset="1" stop-color="#0c0c10"/></linearGradient></defs><rect width="1200" height="240" rx="16" fill="url(#g)"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="43" fill="#f16d87" font-size="14" letter-spacing="3">FROM FIRST INPUT TO SAVED RESULT</text><text x="40" y="98" fill="#bb8392" font-size="13" letter-spacing="2">01 / INPUT</text><text x="40" y="142" fill="#fff1f5" font-size="23" font-weight="700">Bring your question</text><text x="40" y="178" fill="#b9a3ad" font-size="14">A file, text or authorised target</text><path d="M289 128h25m-8-7 8 7-8 7" fill="none" stroke="#ec385d" stroke-width="2"/><text x="335" y="98" fill="#bb8392" font-size="13" letter-spacing="2">02 / TOOL</text><text x="335" y="142" fill="#fff1f5" font-size="23" font-weight="700">Find the right option</text><text x="335" y="178" fill="#b9a3ad" font-size="14">Search with Ctrl + K</text><path d="M584 128h25m-8-7 8 7-8 7" fill="none" stroke="#ec385d" stroke-width="2"/><text x="630" y="98" fill="#bb8392" font-size="13" letter-spacing="2">03 / RESULT</text><text x="630" y="142" fill="#fff1f5" font-size="23" font-weight="700">See the useful details</text><text x="630" y="178" fill="#b9a3ad" font-size="14">Read, compare and copy</text><path d="M879 128h25m-8-7 8 7-8 7" fill="none" stroke="#ec385d" stroke-width="2"/><text x="925" y="98" fill="#bb8392" font-size="13" letter-spacing="2">04 / OUTPUT</text><text x="925" y="142" fill="#fff1f5" font-size="23" font-weight="700">Keep the answer</text><text x="925" y="178" fill="#b9a3ad" font-size="14">Unique automatic exports</text></g></svg>